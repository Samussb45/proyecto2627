site_name: "Proyecto Intermodular"
site_description: "Proyecto Intermodular del Ciclo Formativo de Desarrollo de aplicaciones Web"
site_author: "Samuel Sanchez Belda - IES Los Albares"

# Seleccion del tema Read the Docs
theme:
  name: readthedocs
  highlightjs: true
  hljs_languages:
    - php
    - bash
    - json
    - html

# Estructura de navegacion lateral
nav:
  - Inicio: index.md
  - Práctica 1: practica01.md
# Opciones adicionales
markdown_extensions:
  - tables
  - codehilite
